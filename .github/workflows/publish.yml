name: Publish to NPM
on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      # Required to publish with npm provenance (OIDC).
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.x'
          # No `registry-url`: setup-node then exports a placeholder
          # NODE_AUTH_TOKEN, which would disable OIDC trusted publishing.
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run test -- --no-watch
      - name: Build 🔧
        run: npm run build
      # npm trusted publishing (OIDC). The package must authorize this
      # repository, the `publish.yml` workflow and the `npm-publish`
      # environment on npmjs.com; no npm token is used.
      - name: Publish package on NPM 📦
        run: |
          cd dist/fg-dynamic-component
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NODE_AUTH_TOKEN must be unset for OIDC trusted publishing." >&2
            exit 1
          fi
          npm publish --access=public --provenance --ignore-scripts
